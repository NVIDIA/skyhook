# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cli-update-state-reject
spec:
  concurrent: false
  timeouts:
    assert: 180s
    exec: 90s
  catch:
    - get:
        apiVersion: v1
        kind: Node
        selector: nodewright.nvidia.com/test-node=skyhooke2e
        format: yaml
    - get:
        apiVersion: nodewright.nvidia.com/v1alpha1
        kind: NodeWright
        name: cli-update-state-reject-test
        format: yaml
    - get:
        apiVersion: v1
        kind: Pod
        namespace: nodewright
        format: yaml
  steps:
  # Step 0: Reset state from previous runs
  - name: reset-state
    try:
    - script:
        timeout: 30s
        content: |
          ../nodewright-cli reset cli-update-state-reject-test --confirm 2>/dev/null || true
          echo "State reset complete"

  # Step 1: Create a Skyhook and wait for it to complete
  - name: setup-skyhook
    try:
    - apply:
        file: nodewright.yaml
    - assert:
        file: assert-nodewright-complete.yaml

  # Step 2: update-state must reject a package that is not in the Skyhook spec
  - name: reject-unknown-package
    try:
    - script:
        timeout: 30s
        content: |
          set -e
          out=$(../nodewright-cli update-state cli-update-state-reject-test nonexistent-pkg 1.2.3 apply complete --confirm 2>&1) && {
            echo "expected non-zero exit, got success: $out"
            exit 1
          }
          echo "$out" | grep -qi "not found in spec" || {
            echo "expected error mentioning 'not found in spec', got: $out"
            exit 1
          }
          echo "unknown package correctly rejected"

  # Step 3: update-state must reject an invalid stage value
  - name: reject-invalid-stage
    try:
    - script:
        timeout: 30s
        content: |
          set -e
          out=$(../nodewright-cli update-state cli-update-state-reject-test test-package 1.2.3 bogus-stage complete --confirm 2>&1) && {
            echo "expected non-zero exit, got success: $out"
            exit 1
          }
          echo "$out" | grep -qi "invalid stage" || {
            echo "expected error mentioning 'invalid stage', got: $out"
            exit 1
          }
          echo "invalid stage correctly rejected"

  # Step 4: update-state must reject an invalid state value
  - name: reject-invalid-state
    try:
    - script:
        timeout: 30s
        content: |
          set -e
          out=$(../nodewright-cli update-state cli-update-state-reject-test test-package 1.2.3 apply weird-state --confirm 2>&1) && {
            echo "expected non-zero exit, got success: $out"
            exit 1
          }
          echo "$out" | grep -qi "invalid state" || {
            echo "expected error mentioning 'invalid state', got: $out"
            exit 1
          }
          echo "invalid state correctly rejected"

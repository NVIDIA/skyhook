# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cli-update-state
spec:
  concurrent: false
  timeouts:
    assert: 180s
    exec: 90s
  catch:
    - get:
        apiVersion: v1
        kind: Node
        selector: nodewright.nvidia.com/test-node=skyhooke2e
        format: yaml
    - get:
        apiVersion: nodewright.nvidia.com/v1alpha1
        kind: NodeWright
        name: cli-update-state-test
        format: yaml
    - get:
        apiVersion: v1
        kind: Pod
        namespace: skyhook
        format: yaml
  steps:
  # Step 0: Reset state from previous runs
  - name: reset-state
    try:
    - script:
        timeout: 30s
        content: |
          ../nodewright-cli reset cli-update-state-test --confirm 2>/dev/null || true
          echo "State reset complete"

  # Step 1: Create a Skyhook and wait for it to complete
  - name: setup-skyhook
    try:
    - apply:
        file: skyhook.yaml
    - assert:
        file: assert-skyhook-complete.yaml

  # Step 2: Disable the Skyhook so the operator won't reconcile away our manual
  # edit before we can assert it.
  - name: disable-skyhook
    try:
    - script:
        timeout: 30s
        content: |
          ../nodewright-cli disable cli-update-state-test --confirm
    - assert:
        file: assert-skyhook-disabled.yaml

  # Step 3: Run update-state to flip the package to stage=apply, state=erroring
  - name: test-update-state
    try:
    - script:
        timeout: 30s
        content: |
          ../nodewright-cli update-state cli-update-state-test test-package 1.2.3 apply erroring --confirm

  # Step 4: Assert the per-node annotation reflects the manual edit. The
  # nodeState annotation is JSON-as-string, so we use jq rather than a native
  # chainsaw assert to inspect the entry for `test-package|1.2.3`.
  - name: assert-node-state
    try:
    - script:
        timeout: 30s
        content: |
          set -eu
          nodes=$(kubectl get nodes -l nodewright.nvidia.com/test-node=skyhooke2e -o jsonpath='{.items[*].metadata.name}')
          if [ -z "$nodes" ]; then
            echo "no test nodes found"
            exit 1
          fi
          fail=0
          for node in $nodes; do
            raw=$(kubectl get node "$node" -o jsonpath='{.metadata.annotations.nodewright\.nvidia\.com/nodeState_cli-update-state-test}')
            if [ -z "$raw" ]; then
              echo "node $node: nodeState annotation missing"
              fail=1
              continue
            fi
            entry=$(printf '%s' "$raw" | jq -r '.["test-package|1.2.3"] // empty')
            if [ -z "$entry" ]; then
              echo "node $node: no entry for test-package|1.2.3"
              echo "annotation: $raw"
              fail=1
              continue
            fi
            stage=$(printf '%s' "$entry" | jq -r '.stage')
            state=$(printf '%s' "$entry" | jq -r '.state')
            if [ "$stage" != "apply" ] || [ "$state" != "erroring" ]; then
              echo "node $node: expected stage=apply state=erroring, got stage=$stage state=$state"
              fail=1
              continue
            fi
            echo "node $node: stage=$stage state=$state OK"
          done
          exit $fail

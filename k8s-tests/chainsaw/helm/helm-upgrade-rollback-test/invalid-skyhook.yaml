## RENAME-SHIM: this whole file. Legacy group on purpose, because after the rollback the
## only operator running is the pre-rename one, which serves skyhook.nvidia.com and
## nothing else. Once the baseline is post-rename, delete this and point the
## admission-works-after-rollback step at invalid-nodewright.yaml.
apiVersion: skyhook.nvidia.com/v1alpha1
kind: Skyhook
metadata:
  name: rollback-reject
spec:
  packages:
    cookies:
      version: "3.2.3"
      image: ghcr.io/nvidia/skyhook/agentless
      dependsOn:
        milkshake: "1.2.3" ## invalid dependency
    milk:
      ## Semver, so the ONLY thing invalid about this CR is the missing dependency
      ## above. The test asserts the rejection reason, which a second validation
      ## failure could pre-empt.
      version: "1.2.0"
      image: ghcr.io/nvidia/skyhook/agentless

## RENAME-SHIM: this whole file. Baseline guard for the one-time resource-name rename:
## the published chart really does create the pre-rename names, so the "legacy names are
## gone" step downstream is asserting something. It guards the test, not the product.
## With a post-rename baseline there is nothing here to check beyond the Deployment
## being Ready, which the upgrade step covers anyway.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: skyhook-operator-validating-webhook
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: skyhook-operator-mutating-webhook
---
apiVersion: v1
kind: Service
metadata:
  name: skyhook-operator-webhook-service
  namespace: nodewright
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skyhook-operator-manager-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodewright-controller-manager
  namespace: nodewright
status:
  (readyReplicas > `0`): true

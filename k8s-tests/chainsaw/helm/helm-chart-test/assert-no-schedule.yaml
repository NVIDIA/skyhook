apiVersion: v1
kind: Pod
metadata:
  annotations:
    kubectl.kubernetes.io/default-container: manager
  labels:
    app: nodewright-controller-manager
    app.kubernetes.io/instance: foobar
    app.kubernetes.io/name: nodewright
    control-plane: controller-manager
  namespace: skyhook
  ownerReferences:
  - apiVersion: apps/v1
    blockOwnerDeletion: true
    controller: true
    kind: ReplicaSet
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/arch
            operator: In
            values:
            - amd64
            - arm64
          - key: kubernetes.io/os
            operator: In
            values:
            - linux
  containers:
  - command:
    - /manager
    ((env[?name == 'RUNTIME_REQUIRED_TAINT'].value)[0] == 'skyhook.nvidia.com=runtime-required:NoSchedule'): true 
    (image == 'ghcr.io/nvidia/nodewright/operator:latest' || contains(image, 'localhost:5005/skyhook-operator')): true
    livenessProbe:
      failureThreshold: 3
      httpGet:
        path: /healthz
        port: 8081
        scheme: HTTP
      initialDelaySeconds: 15
      periodSeconds: 20
      successThreshold: 1
      timeoutSeconds: 1
    name: manager
    ports:
    - containerPort: 8443
      name: https
      protocol: TCP
    - containerPort: 9443
      name: webhook-server
      protocol: TCP
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8081
        scheme: HTTP
      initialDelaySeconds: 5
      periodSeconds: 20
      successThreshold: 1
      failureThreshold: 2
      timeoutSeconds: 3
    resources:
      limits:
        (cpu == '1000m' || cpu == '1' || cpu == `1`): true
        memory: 512Mi
      requests:
        cpu: 500m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
  dnsPolicy: ClusterFirst
  enableServiceLinks: true
  preemptionPolicy: PreemptLowerPriority
  priority: 0
  restartPolicy: Always
  schedulerName: default-scheduler
  securityContext:
    runAsNonRoot: true
  serviceAccount: nodewright-controller-manager
  serviceAccountName: nodewright-controller-manager
  terminationGracePeriodSeconds: 10
  (tolerations[?key == 'dedicated']):
  - effect: NoSchedule
    operator: Equal
    value: system-cpu
status:
  conditions:
  - lastProbeTime: null
    reason: Unschedulable
    status: "False"
    type: PodScheduled
  phase: Pending

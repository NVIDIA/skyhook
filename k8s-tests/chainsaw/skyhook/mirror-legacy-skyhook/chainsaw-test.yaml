# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mirror-legacy-skyhook
  labels:
    pool: core
spec:
  timeouts:
    assert: 120s
    cleanup: 120s
  catch: ## if errors, print the legacy source and the mirrored target
    - get:
        apiVersion: skyhook.nvidia.com/v1alpha1
        kind: Skyhook
        name: mirror-legacy-skyhook
        format: yaml
    - get:
        apiVersion: nodewright.nvidia.com/v1alpha1
        kind: NodeWright
        name: mirror-legacy-skyhook
        format: yaml
  steps:
  - name: mirror
    description: Applying a legacy Skyhook makes the mirror controller create an equivalent NodeWright.
    try:
    - apply:
        file: skyhook.yaml
    - assert:
        file: assert-nodewright.yaml
    finally:
    ## Delete the legacy source first so the mirror stops reconciling, then the
    ## mirrored NodeWright. The mirror never deletes its target, so it must be
    ## cleaned up explicitly.
    - delete:
        ref:
          apiVersion: skyhook.nvidia.com/v1alpha1
          kind: Skyhook
          name: mirror-legacy-skyhook
    - delete:
        ref:
          apiVersion: nodewright.nvidia.com/v1alpha1
          kind: NodeWright
          name: mirror-legacy-skyhook

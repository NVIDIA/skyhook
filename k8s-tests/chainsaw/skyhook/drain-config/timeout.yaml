---
apiVersion: v1
kind: Pod
metadata:
  name: drain-config-blocker
  namespace: skyhook
  labels:
    app: drain-config-blocker
spec:
  terminationGracePeriodSeconds: 5
  restartPolicy: Never
  nodeSelector:
    skyhook.nvidia.com/test-node: skyhooke2e
  containers:
  - name: workload
    image: ghcr.io/nvidia/skyhook/agentless:3.2.3
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "sleep 1000"]
---
apiVersion: skyhook.nvidia.com/v1alpha1
kind: Skyhook
metadata:
  name: drain-config-timeout
  namespace: skyhook
spec:
  drainConfig:
    force: false
    timeout: 5s
  nodeSelectors:
    matchLabels:
      skyhook.nvidia.com/test-node: skyhooke2e
  interruptionBudget:
    count: 1
  packages:
    drain-timeout:
      version: "1.2.3"
      image: ghcr.io/nvidia/skyhook/agentless
      interrupt:
        type: service
        services: [rsyslog]
      env:
      - name: SLEEP_LEN
        value: "1"

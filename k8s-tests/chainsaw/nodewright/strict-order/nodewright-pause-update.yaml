apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  labels:
    app.kubernetes.io/part-of: skyhook-operator
    app.kubernetes.io/created-by: skyhook-operator
  name: strict-order-skyhook-zzz
  annotations:
    nodewright.nvidia.com/disable: "false"
    nodewright.nvidia.com/pause: "false"
spec:
  priority: 1
  nodeSelectors:
    matchLabels:
      nodewright.nvidia.com/strict-order-test: "true"
  packages:
    foobar:
      interrupt:
        type: service
        services: [cron]
      version: "1.2"
      image: ghcr.io/nvidia/skyhook/agentless
      env: 
        - name: SLEEP_LEN
          value: "3" ## making faster so the test works for asserting node condition
---

apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: stage-timeout
spec:
  nodeSelectors:
    matchLabels:
      nodewright.nvidia.com/test-node: skyhooke2e
  interruptionBudget:
    count: 1
  packages:
    ## The whole test is the gap between these two numbers: the step asks to run for ten
    ## minutes, the stage is allowed twenty seconds. Anything that reports DeadlineExceeded
    ## here proves the deadline fired, without the test having to measure wall-clock.
    laggard:
      ## version is the agentless image tag; only published tags work here.
      version: "1.2.3"
      image: ghcr.io/nvidia/skyhook/agentless
      stageTimeout: 20s
      env:
      - name: SLEEP_LEN
        value: "600"

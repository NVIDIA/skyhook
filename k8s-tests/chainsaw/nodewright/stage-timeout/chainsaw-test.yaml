# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: stage-timeout
  labels:
    pool: core
spec:
  timeouts:
    assert: 240s
  catch:
    - get:
        apiVersion: nodewright.nvidia.com/v1alpha1
        kind: NodeWright
        name: stage-timeout
        format: yaml
    - script:
        content: |
          kubectl get jobs -n nodewright -l nodewright.nvidia.com/name=stage-timeout -o yaml || true
          kubectl get pods -n nodewright -l nodewright.nvidia.com/name=stage-timeout -o wide || true
  steps:
  - name: the-deadline-is-per-attempt
    description: >
      A package stage carries its timeout on the pod template, not the Job. The Job-level
      ceiling was removed so the retry budget is what bounds a stage overall; a unit test
      can assert the field is written, but only a cluster runs the kubelet clock that acts
      on it.
    try:
    - script:
        content: |
          ../nodewright-cli reset stage-timeout --confirm 2>/dev/null || true
    - create:
        file: nodewright.yaml
    - assert:
        resource:
          apiVersion: batch/v1
          kind: Job
          metadata:
            namespace: nodewright
            labels:
              nodewright.nvidia.com/name: stage-timeout
              nodewright.nvidia.com/package: laggard-1.2.3
              nodewright.nvidia.com/stage: apply
          spec:
            template:
              spec:
                ## From the package's stageTimeout. Per attempt: each retry gets its own
                ## twenty seconds rather than sharing one budget across the stage.
                activeDeadlineSeconds: 20
    - script:
        ## A Job-level deadline would cap the whole stage including its retries, which is
        ## what #402 removed. jsonpath prints nothing for an absent field, so empty is the
        ## assertion; chainsaw cannot express "this field must not exist".
        content: |
          dl=$(kubectl get jobs -n nodewright \
            -l nodewright.nvidia.com/name=stage-timeout,nodewright.nvidia.com/stage=apply \
            -o jsonpath='{.items[*].spec.activeDeadlineSeconds}')
          if [ -n "$dl" ]; then
            echo "FAIL: Job carries a whole-stage deadline of ${dl}s; the ceiling should be per-attempt only"
            exit 1
          fi
          echo "OK: no Job-level activeDeadlineSeconds"

  - name: the-attempt-is-killed-on-the-clock
    description: >
      The step sleeps for 600s and the stage is allowed 20s, so a pod that reports
      DeadlineExceeded can only have been killed by the deadline. It fails in place rather
      than being deleted, which is what keeps its logs readable afterwards.
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: nodewright
            labels:
              nodewright.nvidia.com/name: stage-timeout
              nodewright.nvidia.com/package: laggard-1.2.3
              nodewright.nvidia.com/stage: apply
          status:
            phase: Failed
            reason: DeadlineExceeded

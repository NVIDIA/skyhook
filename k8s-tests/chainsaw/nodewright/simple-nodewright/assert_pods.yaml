---
kind: Pod
apiVersion: v1
metadata:
  namespace: nodewright
  labels:
    nodewright.nvidia.com/name: simple-skyhook
    nodewright.nvidia.com/package: spencer-3.2.3
  annotations:
    ("nodewright.nvidia.com/package" && parse_json("nodewright.nvidia.com/package")):
      {
        "name": "spencer",
        "version": "3.2.3",
        "skyhook": "simple-skyhook",
        "stage": "apply",
        "image": "ghcr.io/nvidia/skyhook/agentless"
      }
  ownerReferences:
    ## controller: true proves the pod is the Job's child, not merely referencing one. The Job's
    ## own name is deliberately not asserted: it carries a config hash, so pinning it here would
    ## break every test on any change to the naming scheme. assert_jobs.yaml covers Job ownership.
    - apiVersion: batch/v1
      kind: Job
      controller: true
spec:
  initContainers:
    - name: spencer-init
      resources: ## including these to tests defaults are working
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 500m
          memory: 256Mi
    - name: spencer-apply
      args:
        ([0]): apply
        ([1]): /root
        (length(@)): 3
      resources: ## including these to tests defaults are working
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 500m
          memory: 256Mi
    - name: spencer-applycheck
      args:
        ([0]): apply-check
        ([1]): /root
        (length(@)): 3
      resources: ## including these to tests defaults are working
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 500m
          memory: 256Mi
---
kind: Pod
apiVersion: v1
metadata:
  namespace: nodewright
  labels:
    nodewright.nvidia.com/name: simple-skyhook
    nodewright.nvidia.com/package: foobar-1.2
  annotations:
    ("nodewright.nvidia.com/package" && parse_json("nodewright.nvidia.com/package")):
      {
        "name": "foobar",
        "version": "1.2",
        "skyhook": "simple-skyhook",
        "stage": "apply",
        "image": "ghcr.io/nvidia/skyhook/agentless"
      }
  ownerReferences:
    ## controller: true proves the pod is the Job's child, not merely referencing one. The Job's
    ## own name is deliberately not asserted: it carries a config hash, so pinning it here would
    ## break every test on any change to the naming scheme. assert_jobs.yaml covers Job ownership.
    - apiVersion: batch/v1
      kind: Job
      controller: true
spec:
  initContainers:
    - name: foobar-init
      resources: ## Testing overriding
        limits:
          cpu: 50m
          memory: 32Mi
        requests:
          cpu: 50m
          memory: 32Mi
    - name: foobar-apply
      args:
        ([0]): apply
        ([1]): /root
        (length(@)): 3
      resources: ## Testing overriding
        limits:
          cpu: 50m
          memory: 32Mi
        requests:
          cpu: 50m
          memory: 32Mi
    - name: foobar-applycheck
      args:
        ([0]): apply-check
        ([1]): /root
        (length(@)): 3
      resources: ## Testing overriding
        limits:
          cpu: 50m
          memory: 32Mi
        requests:
          cpu: 50m
          memory: 32Mi
---

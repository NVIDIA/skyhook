apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: kubelet-refused
spec:
  nodeSelectors:
    matchLabels:
      nodewright.nvidia.com/test-node: skyhooke2e
  interruptionBudget:
    count: 1
  packages:
    ## Package pods carry spec.nodeName, so they bypass the scheduler and kubelet admission
    ## is the only gate. Asking for more CPU than any node has makes every attempt be
    ## rejected before a container starts -- deterministic on any cluster, unlike trying to
    ## provoke a real eviction.
    ##
    ## Resource overrides are all-four-fields-or-none (docs/operations/resource-management.md).
    greedy:
      ## version is the agentless image tag; only published tags work here.
      version: "1.2.3"
      image: ghcr.io/nvidia/skyhook/agentless
      env:
      - name: SLEEP_LEN
        value: "5"
      resources:
        cpuRequest: "500"
        cpuLimit: "500"
        memoryRequest: "800Gi"
        memoryLimit: "800Gi"

## Second legacy Skyhook used only by phase 8 to exercise the migration hold.
##
## It is never rolled out: phase 8 patches its status to in_progress and relies on
## that status being frozen (nothing reconciles the legacy kind post-upgrade) to
## hold the NodeWright cutover deterministically.
##
## The nodeSelector deliberately matches NO node, so this object cannot take over
## kind-worker or disturb the migrated NodeWright under test.
apiVersion: skyhook.nvidia.com/v1alpha1
kind: Skyhook
metadata:
  name: migration-hold-test
spec:
  nodeSelectors:
    matchLabels:
      skyhook.nvidia.com/test-node: no-such-node-label
  packages:
    shellscript:
      version: "1.1.1"
      image: ghcr.io/nvidia/skyhook-packages/shellscript
      configMap:
        apply.sh: |
          #!/bin/bash
          echo "hold test"

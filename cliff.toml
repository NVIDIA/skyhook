# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
# `commit.message` is only the conventional-commit description when the commit
# parses as one; with filter_unconventional = false everything else keeps its full
# raw message, body included. Hence `split | first`: one changelog bullet is one
# subject line, never a commit body.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
            {% if commit.remote.username %} by [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}){%- endif %}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- Generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
    # Some PRs were squashed with GitHub's merge-style subject, so the real
    # conventional message sits in the body: `Merge pull request #N from ...\n\n
    # chore(chart): bump ...`. Drop the subject line so the body is parsed and
    # grouped normally. On release branches this commit is often the only one the
    # path filter keeps, so without this the whole release section renders empty.
    { pattern = '^Merge pull request #[0-9]+ from \S+[ \t]*\r?\n\s*\r?\n', replace = "" },
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
commit_parsers = [
    # Skip real merge commits by parent count, not by subject: they duplicate the
    # branch commits already listed individually, and branch-sync merges carry
    # git's `# Conflicts:` block plus hand-written merge prose in their body. The
    # subject alone can't decide this, because the squashes handled above look
    # identical and do carry content.
    { field = "merge_commit", pattern = "true", skip = true },
    { message = "^feat", group = "New Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^bug", group = "Bug Fixes" },
    { message = "^docs:", skip = true },
    { message = "^test:", skip = true },
    { message = "^lint:", skip = true },
    { message = "^chore: readme", skip = true },
    { message = "^chore: bump version", skip = true },
    { message = "^chore: update CHANGELOG", skip = true },
    { message = "^build: release v[0-9]+\\.[0-9]+\\.[0-9]+", skip = true },
    { message = ".*", group = "Other Tasks" },
]
protect_breaking_commits = false
filter_commits = false
# Matches component-prefixed tags: operator/v0.14.0, chart/v0.14.0, agent/v6.4.0, cli/v0.1.0
tag_pattern = "(operator|chart|agent|cli)/v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chart.fullname" . }}-manager-role
  annotations:
    checkov.io/skip1: CKV_K8S_155=Operator must manage webhook configs for cert rotation
  labels:
  {{- include "chart.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  - validatingwebhookconfigurations
  resourceNames:
  - {{ include "chart.validatingWebhookName" . }}
  - {{ include "chart.mutatingWebhookName" . }}
  {{- /* MIGRATION-SHIM (skyhook-operator -> nodewright resource rename, #440):
         during the upgrade that crosses the rename both the pre-rename webhook
         configurations and a not-yet-terminated old operator replica are still
         around, and the pre-delete cleanup job deletes the legacy names as a
         belt-and-braces. Drop these two entries once the rename window closes. */}}
  - skyhook-operator-validating-webhook
  - skyhook-operator-mutating-webhook
  verbs:
  - get
  - update
  {{- /* delete is what the pre-delete cleanup job needs; without it that job's
         `kubectl delete ...webhookconfiguration` was silently RBAC-denied and
         the `|| true` swallowed the error. */}}
  - delete
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  - validatingwebhookconfigurations
  verbs:
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - nodes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - pods/status
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nodewright.nvidia.com
  resources:
  - deploymentpolicies
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nodewright.nvidia.com
  resources:
  - deploymentpolicies/status
  - nodewrights/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - nodewright.nvidia.com
  resources:
  - nodewrights
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nodewright.nvidia.com
  resources:
  - nodewrights/finalizers
  verbs:
  - update
- apiGroups:
  - skyhook.nvidia.com
  resources:
  - deploymentpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - skyhook.nvidia.com
  resources:
  - skyhooks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - skyhook.nvidia.com
  resources:
  - skyhooks/finalizers
  verbs:
  - update
- apiGroups:
  - skyhook.nvidia.com
  resources:
  - skyhooks/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chart.fullname" . }}-manager-rolebinding
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: {{ include "chart.name" . }}
    app.kubernetes.io/part-of: {{ include "chart.name" . }}
  {{- include "chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chart.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "chart.fullname" . }}-controller-manager
  namespace: '{{ .Release.Namespace }}'

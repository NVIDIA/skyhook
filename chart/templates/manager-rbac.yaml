---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skyhook-operator-manager-rolebinding
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: skyhook-operator
    app.kubernetes.io/part-of: skyhook-operator
  {{- include "chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: skyhook-operator-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "chart.fullname" . }}-controller-manager
  namespace: '{{ .Release.Namespace }}'
---
# Least privilege: these are the kinds the operator only ever touches inside its own namespace,
# so they are a namespaced Role rather than part of the ClusterRole above.
#
#   secrets     only the operator's own webhook serving cert
#   jobs        package-stage Jobs, all created here and every list passes InNamespace
#   pods/log    read only off those Jobs' child pods, for the deadline failure snapshot
#
# Each of these has a namespace-scoped informer in main.go and the two must stay in step: a
# cluster-wide informer under this Role is rejected at LIST/WATCH and the operator fails to
# start. Pods and nodes stay in the ClusterRole — drain has to see workload pods on any node.
# ConfigMaps are also a candidate but stay cluster-wide for now: scoping them correlated with
# unexplained apply-to-config stalls in e2e/core.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skyhook-operator-manager-role
  namespace: '{{ .Release.Namespace }}'
  labels:
  {{- include "chart.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skyhook-operator-manager-namespaced-rolebinding
  namespace: '{{ .Release.Namespace }}'
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: skyhook-operator
    app.kubernetes.io/part-of: skyhook-operator
  {{- include "chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skyhook-operator-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "chart.fullname" . }}-controller-manager
  namespace: '{{ .Release.Namespace }}'

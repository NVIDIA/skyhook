{{- if .Values.webhook.enable }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "chart.mutatingWebhookName" . }}
  labels:
    ## The operator finds this object by this label, not by name, so renaming it
    ## in the chart does not strand a running operator. Do not remove.
    nodewright.nvidia.com/webhook-config: "true"
  {{- include "chart.labels" . | nindent 4 }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "chart.webhookServiceName" . }}
      namespace: {{ .Release.Namespace }}
      path: /mutate-skyhook-nvidia-com-v1alpha1-skyhook
      port: 443
  failurePolicy: Fail
  matchPolicy: Equivalent
  {{/* MIGRATION-SHIM: legacy skyhook.nvidia.com webhook entry; remove with the legacy group in the removal release. */}}
  name: mutate-skyhook.nvidia.com
  namespaceSelector: {}
  objectSelector: {}
  reinvocationPolicy: Never
  rules:
  - apiGroups:
    - skyhook.nvidia.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - skyhooks
    scope: '*'
  sideEffects: None
  timeoutSeconds: 10
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "chart.webhookServiceName" . }}
      namespace: {{ .Release.Namespace }}
      path: /mutate-skyhook-nvidia-com-v1alpha1-deploymentpolicy
      port: 443
  failurePolicy: Fail
  matchPolicy: Equivalent
  {{/* MIGRATION-SHIM: legacy skyhook.nvidia.com webhook entry; remove with the legacy group in the removal release. */}}
  name: mutate-deploymentpolicy.nvidia.com
  namespaceSelector: {}
  objectSelector: {}
  reinvocationPolicy: Never
  rules:
  - apiGroups:
    - skyhook.nvidia.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - deploymentpolicies
    scope: '*'
  sideEffects: None
  timeoutSeconds: 10
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "chart.webhookServiceName" . }}
      namespace: {{ .Release.Namespace }}
      path: /mutate-nodewright-nvidia-com-v1alpha1-nodewright
      port: 443
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: mutate-nodewright.nvidia.com
  namespaceSelector: {}
  objectSelector: {}
  reinvocationPolicy: Never
  rules:
  - apiGroups:
    - nodewright.nvidia.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - nodewrights
    scope: '*'
  sideEffects: None
  timeoutSeconds: 10
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "chart.webhookServiceName" . }}
      namespace: {{ .Release.Namespace }}
      path: /mutate-nodewright-nvidia-com-v1alpha1-deploymentpolicy
      port: 443
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: mutate-deploymentpolicy-nodewright.nvidia.com
  namespaceSelector: {}
  objectSelector: {}
  reinvocationPolicy: Never
  rules:
  - apiGroups:
    - nodewright.nvidia.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - deploymentpolicies
    scope: '*'
  sideEffects: None
  timeoutSeconds: 10
{{- end }}
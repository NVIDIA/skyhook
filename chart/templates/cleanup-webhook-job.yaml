{{- if .Values.webhook.enable }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "chart.fullname" . }}-webhook-cleanup"
  namespace: "{{ .Release.Namespace }}"
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.cleanup.jobTimeoutSeconds }}
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      serviceAccountName: {{ include "chart.fullname" . }}-controller-manager
      # Maintenance job: only talks to the API server, so it must be schedulable
      # anywhere and must NOT inherit the controller-manager's nodeSelector/nodeAffinity
      # (that would make this hook unschedulable, and stall, whenever the operator's
      # placement is restrictive). Tolerations are kept so it can land on tainted nodes.
      {{- with .Values.controllerManager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3607
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
      # kubectl writes its discovery/http cache under KUBECACHEDIR; with a
      # read-only root filesystem it needs a writable mount.
      - name: kube-cache
        emptyDir: {}
      containers:
      - name: cleanup
        image: {{ .Values.webhook.removalImage | default "alpine/kubectl" }}{{- if .Values.webhook.removalDigest }}{{- if .Values.webhook.removalTag }}:{{ .Values.webhook.removalTag | default "latest" }}@{{ .Values.webhook.removalDigest }}{{- else }}@{{ .Values.webhook.removalDigest }}{{- end }}{{- else }}:{{ .Values.webhook.removalTag | default "latest" }}{{- end }}
        imagePullPolicy: Always
        env:
        - name: KUBECACHEDIR
          value: /tmp/kubecache
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access
          readOnly: true
        - mountPath: /tmp/kubecache
          name: kube-cache
        # Guard against limitRange being disabled (set to null/false) with fallback defaults
        resources:
        {{- if .Values.limitRange }}
          limits:
            cpu: {{ .Values.limitRange.default.cpu }}
            memory: {{ .Values.limitRange.default.memory }}
          requests:
            cpu: {{ .Values.limitRange.defaultRequest.cpu }}
            memory: {{ .Values.limitRange.defaultRequest.memory }}
        {{- else }}
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        {{- end }}
        command:
        - /bin/sh
        - -c
        - |
          NAMESPACE="{{ .Release.Namespace }}"
          VALIDATING_WEBHOOK_CONFIGURATION_NAME="skyhook-operator-validating-webhook"
          MUTATING_WEBHOOK_CONFIGURATION_NAME="skyhook-operator-mutating-webhook"
          kubectl delete secret -n $NAMESPACE "{{ .Values.webhook.secretName | default "webhook-cert" }}" || true
          kubectl delete validatingwebhookconfiguration $VALIDATING_WEBHOOK_CONFIGURATION_NAME || true
          kubectl delete mutatingwebhookconfiguration $MUTATING_WEBHOOK_CONFIGURATION_NAME || true
{{- end }} 
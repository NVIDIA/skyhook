# yamllint config — see https://yamllint.readthedocs.io/
# Permissive starting baseline. Tighten over time.
extends: relaxed

rules:
  line-length: disable
  document-start: disable
  comments-indentation: disable
  # Truthy disabled entirely — yamllint flags `on:` keys (GitHub Actions),
  # `yes`/`no` values (common in helm chart values), and similar patterns
  # that are valid in their respective tools.
  truthy: disable
  # Empty lines and indentation rules generate a long tail of noise across
  # generated files (helm chart templates) and example YAML in docs/.
  # Tighten in a follow-up PR after a sweep.
  empty-lines: disable
  indentation: disable
  trailing-spaces: disable
  new-line-at-end-of-file: disable

ignore: |
  operator/vendor/
  agent/vendor/
  # generated by `make manifests`; long lines and odd formatting are expected
  operator/config/crd/bases/
  # generated zz_generated files
  **/zz_generated.*.yaml
  # generated by helmify; format is helm-tool-controlled
  chart/templates/

name: Setup oras
description: Install the oras CLI as a checksum-pinned binary.

runs:
  using: composite
  steps:
    - name: Install oras
      shell: bash
      env:
        # NVIDIA's enterprise restricts which GitHub Actions can be used, so oras
        # is installed as a binary rather than through oras-project/setup-oras.
        # The SHA256 pins protect against tarball replacement on the upstream
        # release, matching how lint-ci installs actionlint and lychee.
        ORAS_VERSION: "1.3.3"
        ORAS_SHA256_AMD64: 9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59
        ORAS_SHA256_ARM64: ac7156f93a21e903f7ad606c792f3560f17e0cd0e36365634701b1e7cc4e4eca
      run: |
        set -euo pipefail

        case "$(uname -m)" in
          x86_64) arch=amd64; sha="${ORAS_SHA256_AMD64}" ;;
          aarch64 | arm64) arch=arm64; sha="${ORAS_SHA256_ARM64}" ;;
          *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
        esac

        tarball="${RUNNER_TEMP}/oras.tar.gz"
        bindir="${RUNNER_TEMP}/oras-bin"

        curl -sSfL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_${arch}.tar.gz" -o "${tarball}"
        echo "${sha}  ${tarball}" | sha256sum -c -

        # Onto PATH rather than into /usr/local/bin so the install needs no root.
        # GITHUB_PATH applies to later steps, so this step calls it by full path.
        mkdir -p "${bindir}"
        tar -xzf "${tarball}" -C "${bindir}" oras
        chmod +x "${bindir}/oras"
        echo "${bindir}" >> "${GITHUB_PATH}"
        "${bindir}/oras" version

name: Create GitHub Release

# Triggered on tag pushes for operator, agent, and chart components.
# CLI releases are handled separately by cli-release.yaml (which also builds binaries).
#
# Tags follow the pattern <component>/v<version> (e.g. operator/v0.14.0).
# Release notes are generated by git-cliff scoped to the tagged component.
# Preview locally with: make changelog-preview COMPONENT=<name>

on:
  push:
    tags:
      - 'operator/**'
      - 'agent/**'
      - 'chart/**'

env:
  # Opt all JS actions into Node 24 ahead of GitHub's Node 20 phase-out.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract component name from tag
        id: extract
        run: |
          COMPONENT=$(echo "${{ github.ref_name }}" | cut -f 1 -d /)
          echo "component=${COMPONENT}" >> $GITHUB_OUTPUT

      - name: Install git-cliff
        run: |
          GC_VERSION=$(curl -sSf https://api.github.com/repos/orhun/git-cliff/releases/latest | grep '"tag_name"' | cut -d '"' -f 4)
          curl -sSL "https://github.com/orhun/git-cliff/releases/download/${GC_VERSION}/git-cliff-${GC_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz --wildcards "*/git-cliff" --strip-components=1
          sudo mv git-cliff /usr/local/bin/

      - name: Generate release notes
        id: release_notes
        run: |
          COMPONENT="${{ steps.extract.outputs.component }}"
          INCLUDE_PATH="${COMPONENT}/**"
          # CLI code lives under operator/cmd/cli/ but is handled by cli-release.yaml
          NOTES=$(git cliff \
            --include-path "${INCLUDE_PATH}" \
            --tag-pattern "${COMPONENT}/.*" \
            --latest \
            --strip all)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "${NOTES}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "${{ steps.release_notes.outputs.notes }}"

  attest-public-chart:
    if: startsWith(github.ref, 'refs/tags/chart/')
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      CHART_IMAGE: nvcr.io/nvidia/skyhook/skyhook-operator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract chart version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#chart/}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Log in to NVCR
        uses: docker/login-action@v4
        with:
          registry: nvcr.io
          username: ${{ secrets.NVCR_REGISTRY_USER }}
          password: ${{ secrets.NVCR_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Resolve public chart digest
        id: digest
        uses: ./.github/actions/resolve-oci-digest
        with:
          image: ${{ env.CHART_IMAGE }}
          tag: ${{ steps.version.outputs.version }}
          attempts: "45"
          retry-delay-seconds: "60"

      - name: Pull public chart package
        id: chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          echo "${{ secrets.NVCR_REGISTRY_PASSWORD }}" | helm registry login nvcr.io \
            --username "${{ secrets.NVCR_REGISTRY_USER }}" \
            --password-stdin
          chart_dir="${RUNNER_TEMP}/nodewright-chart"
          mkdir -p "${chart_dir}"
          helm pull "oci://${CHART_IMAGE}" --version "${VERSION}" --destination "${chart_dir}"
          chart_package="$(find "${chart_dir}" -maxdepth 1 -name 'skyhook-operator-*.tgz' -print -quit)"
          if [ -z "${chart_package}" ]; then
            echo "::error::pulled chart package was not found"
            exit 1
          fi
          echo "package=${chart_package}" >> "${GITHUB_OUTPUT}"

      - name: Sign public chart and attach SBOM
        uses: ./.github/actions/cosign-sign-sbom
        with:
          subject-name: ${{ env.CHART_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-source: ${{ steps.chart.outputs.package }}

      - name: Attest public chart provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.CHART_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Verify public chart signature and attestations
        uses: ./.github/actions/cosign-verify-release
        with:
          subject-name: ${{ env.CHART_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          certificate-identity-regexp: ^https://github.com/${{ github.repository }}/.*$

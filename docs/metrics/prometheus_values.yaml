# Example of scraping the authenticated HTTPS endpoint. The Prometheus
# ServiceAccount must be bound to skyhook-operator-metrics-reader.
extraScrapeConfigs: |
  - job_name: 'nodewright'
    metrics_path: /metrics
    scheme: https
    tls_config:
      # controller-runtime generates an in-memory self-signed certificate for
      # each operator pod, so there is no stable CA for Prometheus to trust.
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    static_configs:
      - targets:
        - skyhook-operator-controller-manager-metrics-service.skyhook.svc.cluster.local:8443

serviceAccounts:
  server:
    create: true
    name: prometheus

global:
  scrape_interval: 5s
  scrape_timeout: 5s
